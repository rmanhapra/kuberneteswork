apiVersion: v1
kind: Pod
metadata:
  name: ephermal-pod
  labels:
    name: ephermal-pod
spec:
  containers:
  - name: ephermal-writer
    image: busybox:1.36.1
    command:
    - 'sh'
    - '-c'
    - 'sleep 3600'
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
    volumeMounts:
    - name: tempstorage
      mountPath: /usr/share/temp 
  - name: ephermal-reader
    image: busybox:1.36.1
    command:
    - 'sh'
    - '-c'
    - 'sleep 3600'
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
    volumeMounts:
    - name: tempstorage
      mountPath: /tmp 
      readOnly: true
  volumes:
  - name: tempstorage
    emptyDir: {}
  
