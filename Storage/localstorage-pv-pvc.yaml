apiVersion: v1
kind: PersistentVolume
metadata:
  name: localpv
spec:
  capacity:
    storage: '1Gi'
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    path: /mnt/disks/local1
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ['minikube']

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localpvc
spec:
  resources:
    requests:
      storage: '1Gi'
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage

---
apiVersion: v1
kind: Pod
metadata:
  name: local-pod
  labels:
    name: local-pod
spec:
  containers:
  - name: local-pod-con
    image: busybox:1.36.1
    command:
    - 'sh'
    - '-c'
    - 'sleep 3600'
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
    volumeMounts:
    - name: localnodevolume
      mountPath: /mnt/share 
  volumes:
    - name: localnodevolume
      persistentVolumeClaim:
       claimName: localpvc




