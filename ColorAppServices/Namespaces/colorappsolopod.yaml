apiVersion: v1
kind: Pod
metadata:
  name: colorapp
  namespace: dev
  labels:
    app: colorapp
spec:
  containers:
  - name: colorapp-container
    image: docker123rakesh/colorapp:v1
    ports:
    - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: colorapp-svc
  namespace: dev
  labels:
    app: colorapp-svc
spec:
  type: ClusterIP
  selector:
    app: colorapp
  ports:
  - port: 80
    targetPort: 80

