apiVersion: v1
kind: Pod
metadata:
  name: colorapp
  namespace: dev
  labels:
    name: colorapp
spec:
  containers:
  - name: colorapp-container
    image: docker123rakesh/colorapp:v1
    ports:
    - containerPort: 80
    resources:
      requests:
        cpu: '1'
        memory: '1Gi'
      limits:
        cpu: '2'
        memory: '2Gi'
      
