apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-ss
spec:
  selector:
    matchLabels:
      app: busybox-app
  serviceName: busybox-app-sss
  replicas: 0
  template:
    metadata:
      labels:
        app: busybox-app
    spec:
      containers:
      - name: busybox-app
        image: busybox:1.36.1
        command:
            - 'sh'
            - '-c'
            - 'sleep 3600'
        resources:
            limits:
              memory: '128Mi'
              cpu: '500m'
        volumeMounts:
        - name: local-volume
          mountPath: /mnt/share
  volumeClaimTemplates:
  - metadata:
      name: local-volume
    spec:
      accessModes: 
      - ReadWriteOnce
      resources:
        requests:
          storage: '250Mi'
      storageClassName: local-storage
