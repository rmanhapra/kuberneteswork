apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
    name: webserver
spec:
  containers:
  - name: nginx-container
    image: nginx:1.27.0
    ports:
      - containerPort: 80

---
# Services section
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    name: feservice
spec:
  type: NodePort
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    name: webserver